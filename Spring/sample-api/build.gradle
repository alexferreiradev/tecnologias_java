plugins {
//	id 'io.spring.dependency-management' version '1.0.11.RELEASE'
	id 'java'
}

group = 'dev.alexferreira'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
	mavenCentral()
}

dependencies {

	def springCoreVersion = "5.3.39"
	implementation "org.springframework:spring-core:${springCoreVersion}"

	implementation "org.springframework:spring-web:${springCoreVersion}"
	implementation "org.springframework:spring-webmvc:${springCoreVersion}"
	implementation "org.springframework:spring-jdbc:${springCoreVersion}", {
		exclude group:'javax.transaction', module: 'jta'
	}
	implementation 'jakarta.transaction:jakarta.transaction-api:1.3.3'
	implementation "org.springframework.data:spring-data-mongodb:3.4.18"
	implementation 'org.springframework.data:spring-data-jpa:2.7.18'
	implementation 'javax.persistence:javax.persistence-api:2.2'
	implementation 'javax.annotation:javax.annotation-api:1.3'
	implementation "org.springframework:spring-orm:${springCoreVersion}", {
		exclude group:'javax.transaction', module: 'jta'
	}
	implementation 'org.springframework.kafka:spring-kafka:2.9.13'
//	implementation ('org.hibernate:hibernate:3.2.1.ga') {
//		exclude group:'javax.transaction', module: 'jta'
//	}

	implementation 'org.postgresql:postgresql:42.2.24'

	implementation("com.azure:azure-storage-blob:12.16.0")

	testImplementation "org.springframework:spring-test:${springCoreVersion}"
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
	testImplementation 'org.mockito:mockito-core:4.10.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:4.10.0'

	testImplementation 'org.springframework.kafka:spring-kafka-test:2.9.13'
	testImplementation 'org.apache.commons:commons-math:2.2'

	testImplementation "org.testcontainers:testcontainers:${testContainersVersion}"
	testImplementation "org.testcontainers:kafka:${testContainersVersion}"
	testImplementation "org.testcontainers:mongodb:${testContainersVersion}"
}

compileJava {}

test {
	useJUnitPlatform()
}
