plugins {
//	id 'io.spring.dependency-management' version '1.0.11.RELEASE'
	id 'java'
}

group = 'dev.alexferreira'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework:spring-core:3.2.18.RELEASE'
	implementation 'org.springframework:spring-web:3.2.18.RELEASE'
	implementation 'org.springframework:spring-webmvc:3.2.18.RELEASE'
	implementation ('org.springframework:spring-jdbc:3.2.18.RELEASE') {
		exclude group:'javax.transaction', module: 'jta'
	}
	implementation 'jakarta.transaction:jakarta.transaction-api:1.3.3'
	implementation 'org.springframework.data:spring-data-mongodb:1.8.6.RELEASE'
	implementation 'org.springframework.data:spring-data-jpa:1.10.6.RELEASE'
	implementation 'javax.persistence:javax.persistence-api:2.2'
	implementation 'javax.annotation:javax.annotation-api:1.3'
	implementation('org.springframework:spring-orm:3.2.18.RELEASE') {
		exclude group:'javax.transaction', module: 'jta'
	}
	implementation 'org.springframework.kafka:spring-kafka:2.6.13'
	implementation ('org.hibernate:hibernate:3.2.1.ga') {
		exclude group:'javax.transaction', module: 'jta'
	}

	implementation 'org.postgresql:postgresql:42.2.24'

	implementation("com.azure:azure-storage-blob:12.16.0")

	testImplementation 'org.springframework:spring-test:3.2.18.RELEASE'
	testImplementation 'org.springframework.kafka:spring-kafka-test:2.6.13'
	testImplementation 'org.apache.commons:commons-math:2.2'

	testImplementation "org.testcontainers:testcontainers:${testContainersVersion}"
	testImplementation "org.testcontainers:kafka:${testContainersVersion}"
	testImplementation "org.testcontainers:mongodb:${testContainersVersion}"
}

compileJava {}

test {
	useJUnitPlatform()
}
